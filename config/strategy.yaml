# Project Panthera — strategy parameters.
#
# Every tunable in the strategy lives here. Values marked GUESS are documented
# placeholders pending calibration (`panthera-mvp calibrate --write-config`
# writes overrides to config/strategy.calibrated.yaml, which is merged on top
# of this file). Edit this file to override anything by hand — no code changes
# needed. Every pick records a config_hash so results always trace back to the
# exact parameter set that produced them.

meta:
  version: 1
  calibrated: false

season:
  # docs/sports_betting_process.md §6: "Exclude spring training data from
  # analysis." MLB gameType R = regular season.
  game_types: ["R"]

# §2: each day is a Public (P) or Vegas (V) day; Wednesday is explicitly
# hybrid (AM public / PM Vegas). The doc never states the Mon-Sun mapping —
# GUESS below, replaced by data-driven calibration.
day_map:
  # Corrected 2026-08-19 against the source recordings (P1 02:10, restated
  # 99:41): "Monday...public day...Tuesday...Vegas day...Wednesday...hybrid
  # day...Thursday...Vegas day...Friday...public day...both Saturday and
  # Sunday are both going to be Vegas days." Previously `saturday: P` here
  # (a typo/guess) let the day-map calibration sweep search a space that
  # included an already-wrong day for Saturday; combined with
  # strategy.calibrated.yaml's now-removed VVHPPPP override, the *live*
  # engine ran an inverted map on 4 of 6 days for its entire history. See
  # docs/mvp-design.md and reports/CALIBRATION.md for the fuller account.
  # fav_ml/dog_ml freeze their own pre-fix value — see their YAMLs.
  monday: P
  tuesday: V
  wednesday: HYBRID
  thursday: V
  friday: P
  saturday: V
  sunday: V

# §2: hybrid day boundary. Games starting before this ET hour are Public
# slots, at/after are Vegas slots. Corrected 2026-08-19: the presenter works
# in CST throughout the recording (P1 10:34: "before 5pm CST... after 5pm
# CST"; confirmed by his own live walkthrough writing a 12:20 PM ET game as
# "11:20 AM", P1 571/578) -- 5 PM CST = 18:00 ET, not the previous 16 (4 PM
# ET) guess. fav_ml/dog_ml freeze their own pre-fix value.
hybrid_boundary_hour_et: 18

movement:
  # §1: line shortening (-160 -> -180) = public money; line drifting
  # (-180 -> -160) = Vegas. Minimum absolute American-odds delta to count as
  # a real signal rather than noise. Corrected 2026-08-19: P2 34:46-35:05
  # states this directly — "I typically like to see at least like five
  # points paying less in public... if it's five plus, then I'm usually good
  # to go." (Previously a GUESS of 10 that the calibration sweep
  # independently converged on 5 for anyway — this makes the documented
  # value the source of truth instead of a coincidence.) fav_ml/dog_ml
  # freeze their own pre-fix value.
  min_move_cents: 5
  # Consensus price = median across bookmakers at each snapshot.
  reference: consensus_median

thresholds:
  # §6: "underdog spread in evenly matched public slots". Evenly matched =
  # favorite ML no shorter than this. GUESS.
  evenly_matched_max_abs_ml: 130
  # Secondary evenness check on probable-pitcher ERA gap. GUESS.
  evenly_matched_max_era_diff: 0.75
  # §6: "Guidelines for high Moneyline odds (-200, -250, -300)". Picked side
  # shorter than this triggers heavy_fav_action. GUESS (uses the doc's first
  # tier).
  heavy_fav_abs_ml: 200
  # What to do with a heavy favorite pick: run_line (convert ML -> fav -1.5)
  # or pass. Corrected 2026-08-19: P1 83:43-85:17 -- "if it is a minus 200
  # money line for a team, I personally skipped a game... those are typically
  # what you call parlay breakers." The source passes, it never converts to
  # the run line. fav_ml/dog_ml freeze their own pre-fix value.
  heavy_fav_action: pass

dossier:
  # §3/§5: recent outcomes and trends used as tiebreakers when line movement
  # is neutral. Cascade: ERA edge -> last-10 form -> season-series lead.
  last10_n: 10
  # Minimum last-10 win gap between the teams to count as a form edge. GUESS.
  min_last10_win_gap: 3
  # Minimum season-series win lead to count as a series edge. GUESS.
  min_series_lead: 2

staking:
  # Flat staking for the paper-trade ledger.
  flat_stake: 100

bet_limits:
  max_picks_per_day: 6
  one_pick_per_game: true
  # Cap semantics version marker (hashed). `per_day` = the daily cap counts
  # picks already recorded today across runs. The original code applied the
  # cap per *invocation* — morning and pregame runs each got a fresh budget,
  # producing 7-8 picks on 4 of the first 15 live days. Fixing it changes
  # which picks exist, so the marker forces a new config_hash: the report
  # segments pre-fix and post-fix picks instead of silently pooling them.
  cap_semantics: per_day

# Scheduled picks runs (ET). Drives the late-run guard: GitHub cron drift can
# fire a run hours late (observed 2026-08-06, ~4h), silently shrinking the
# slate; runs starting more than late_run_grace_minutes past schedule write a
# durable note into the run log / daily report.
runs:
  morning: {snapshot_label: open, scheduled_et: "10:35"}
  pregame: {snapshot_label: pregame, scheduled_et: "16:50"}
  late_run_grace_minutes: 90

odds_api:
  regions: us
  markets: [h2h, spreads, totals]
  # Hard stop: refuse a live snapshot when the monthly credit balance is at or
  # below this floor (free tier = 500/month, each snapshot = 3 credits).
  min_credits_reserve: 30

lumify:
  # Public betting splits. Observational for the P/V rules engine (never an
  # input there); splits-based strategies (config/strategies/) consume them as
  # a signal. Free tier grant = 1,000 non-expiring credits (observed opening
  # balance 1,082). Fetch policy: only not-yet-started events on the target ET
  # day (Lumify's date param is UTC-keyed, so the evening fetch queries both
  # overlapping UTC dates); the morning fetch covers only the <16:00 ET
  # window. Guard mirrors odds_api.
  league: MLB
  min_credits_reserve: 50
