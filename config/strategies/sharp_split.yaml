# Forward-test: back the side whose money share (handle_pct) exceeds its
# ticket share (bets_pct) — the classic sharp-money signature, measured by
# Lumify splits rather than inferred from line movement.
#
# DISABLED until: (1) ~3 days of post-fetch-policy splits data exist (the
# thresholds' volume rule is defined on the new capture semantics), and
# (2) scripts/splits_replay.py's variant table is committed and the final
# thresholds are set by the pre-stated mechanical rule — "largest
# min_handle_minus_bets yielding >= 4 qualifying bets/day, deduped to one per
# (date, game_pk)". Thresholds are volume-chosen, never in-sample-ROI-chosen:
# the in-window replay spans roughly -11% to +3% ROI at n=30-86 (SE 11-18
# pts) — noise either way, disclosed in docs/mvp-design.md.
#
# Evaluation: SCREEN checkpoints only (no verdict) — at ~4 bets/day, a
# 300-pick verdict needs ~70 slates but the Lumify budget affords ~40-60.
# Pre-registered stopping rule: evaluation ends when Lumify credits hit the
# reserve floor; the final state is the last SCREEN. Anti-optional-stopping:
# if the credit budget is extended after seeing interim results, this
# strategy is permanently exploratory (can never print a verdict); a
# verdict-eligible successor requires a new id and a budget funded before
# its registration. Any change to splits_signal.* retires this id
# (sharp_split_v2, fresh counters). Evaluation starts at registered_at; all
# earlier splits data is the excluded exploration window.
strategy:
  id: sharp_split
  engine: sharp_split
  enabled: true
  kind: forward_test
  scope: [live]
  registered_at: "2026-08-23"
  # 2026-10-15 — SCOPE BUG FIX, NOT A TUNING. config/strategy.yaml's
  # `season.game_types: ["R"]` was a regular-season whitelist the source
  # material never asked for (docs/sports_betting_process.md §6 excludes
  # spring training and nothing else). From 2026-09-29 it made every engine
  # Pass on every postseason game: 14 consecutive slate days, 145 passes,
  # zero picks, across all five live strategies. The fix replaces it with
  # `season.exclude_game_types: ["S","E","A","I"]`, which moves this
  # strategy's config_hash afcd384952 -> 2526d326be.
  #
  # Why this EXTENDS the lineage rather than registering a successor: the
  # change is domain-extending, not behavior-altering. Restricted to the
  # games the old config admitted (game_type == "R"), the two configs are
  # provably identical decision functions — tests/test_scope_fix_regression.py
  # replays both gates over the full captured regular-season history (at least 793
  # games over 59 dates) and asserts byte-identical engine output. No pick
  # already in the ledger would have been different, so pooling does not
  # contaminate the pre-fix sample. What IS new is a population (postseason)
  # the day map was never calibrated on; that is disclosed in
  # BETTING_REPORT.md's regime caveat and the per-strategy by-phase split,
  # not hidden behind the hash. A tuning — a threshold, a weight, a day-map
  # cell — would still require a new strategy id. See src/panthera_mvp/
  # CLAUDE.md for the rule this is an instance of.
  hash_lineage: [afcd384952, 2526d326be]
  hypothesis: >
    A side taking a much larger share of money than of tickets is where
    informed ("sharp") bettors are. Backing that side at the latest lines.csv
    consensus beats the vig. Grounded in 16 days of measured divergences
    (e.g. 29% tickets / 86% handle); no historical splits exist, so this is
    forward-test only and is NOT backtestable.

splits_signal:
  market: moneyline
  min_handle_minus_bets: 10      # volume-rule output on the post-fix Aug 17-22 window (docs/proofs/splits-replay.md)
  min_handle_pct: 50
  max_abs_price: 300             # price read from lines.csv consensus, never splits
  max_staleness_hours: 12

verdict: null
screen: {checkpoints: [100, 200]}

bet_limits:
  max_picks_per_day: 6
  one_pick_per_game: true
staking:
  flat_stake: 100
