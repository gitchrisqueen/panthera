# Forward-test: bet against the side holding a lopsided share of TICKETS —
# the standard contrarian "fade the public" hypothesis, on the same Lumify
# data as sharp_split at zero extra credits.
#
# DISABLED until registration alongside sharp_split (same post-fetch-policy
# measurement window, same mechanical volume rule for the threshold: largest
# min_tickets_pct yielding >= 6 qualifying bets/day, deduped to one per
# (date, game_pk); rule output on the Aug 1-16 window: F=70 at 6.8/day). Same stopping and
# anti-optional-stopping rules as sharp_split. Correlated with sharp_split by
# construction (in-window estimate: ~41% same-side overlap; recomputed at
# registration) — the report's shared-pick column keeps that visible, and the
# two results are NOT independent evidence.
strategy:
  id: fade_public
  engine: fade_public
  enabled: true
  kind: forward_test
  scope: [live]
  registered_at: "2026-08-23"
  # 2026-10-15 — SCOPE BUG FIX, NOT A TUNING. config/strategy.yaml's
  # `season.game_types: ["R"]` was a regular-season whitelist the source
  # material never asked for (docs/sports_betting_process.md §6 excludes
  # spring training and nothing else). From 2026-09-29 it made every engine
  # Pass on every postseason game: 14 consecutive slate days, 145 passes,
  # zero picks, across all five live strategies. The fix replaces it with
  # `season.exclude_game_types: ["S","E","A","I"]`, which moves this
  # strategy's config_hash 256514e8ad -> 98b91db942.
  #
  # Why this EXTENDS the lineage rather than registering a successor: the
  # change is domain-extending, not behavior-altering. Restricted to the
  # games the old config admitted (game_type == "R"), the two configs are
  # provably identical decision functions — tests/test_scope_fix_regression.py
  # replays both gates over the full captured regular-season history (793
  # games, 59 dates) and asserts byte-identical engine output. No pick
  # already in the ledger would have been different, so pooling does not
  # contaminate the pre-fix sample. What IS new is a population (postseason)
  # the day map was never calibrated on; that is disclosed in
  # BETTING_REPORT.md's regime caveat and the per-strategy by-phase split,
  # not hidden behind the hash. A tuning — a threshold, a weight, a day-map
  # cell — would still require a new strategy id. See src/panthera_mvp/
  # CLAUDE.md for the rule this is an instance of.
  hash_lineage: [256514e8ad, 98b91db942]
  hypothesis: >
    Heavily ticketed sides are overpriced by recreational flow; the opposite
    side at the latest lines.csv consensus beats the vig. Forward-test only;
    NOT backtestable (no historical splits).

splits_signal:
  market: moneyline
  min_tickets_pct: 65            # volume-rule output on the post-fix Aug 17-22 window (docs/proofs/splits-replay.md)
  max_abs_price: 300
  max_staleness_hours: 12

verdict: null
screen: {checkpoints: [100, 200]}

bet_limits:
  max_picks_per_day: 10
  one_pick_per_game: true
staking:
  flat_stake: 100
