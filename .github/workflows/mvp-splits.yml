name: MVP Splits Collection

# Manual-only: collect public betting splits (Lumify) for today's slate on
# demand — used to verify the LUMIFY_API_KEY and for catch-up runs. The
# scheduled pregame workflow also collects splits daily at 16:50 ET.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use fixture splits instead of live Lumify calls"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: panthera-data
  cancel-in-progress: false

jobs:
  splits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Collect betting splits
        env:
          LUMIFY_API_KEY: ${{ secrets.LUMIFY_API_KEY }}
          PANTHERA_SPLITS_FIXTURE: tests/fixtures/lumify_splits.json
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            panthera-mvp splits --dry-run
          else
            panthera-mvp splits
          fi

      - name: Regenerate reports
        run: panthera-mvp report

      - name: Commit & push
        run: |
          git config user.name "panthera-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: splits run $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
