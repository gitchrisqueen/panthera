name: MVP Splits Collection

# Manual-only: collect public betting splits (Lumify) for today's slate on
# demand — used to verify the LUMIFY_API_KEY and for catch-up runs. The
# scheduled pregame workflow also collects splits daily at 16:50 ET.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use fixture splits instead of live Lumify calls"
        type: boolean
        default: false
      label:
        description: "Snapshot label to store the fetch under"
        type: choice
        options: [manual, morning, pregame]
        default: manual

permissions:
  contents: read

concurrency:
  group: panthera-data
  cancel-in-progress: false

jobs:
  splits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    env:
      IN_LABEL: ${{ inputs.label }}
      IN_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Overlay bot data from the data branch
        run: bash scripts/ci/data_branch.sh pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Collect betting splits
        env:
          LUMIFY_API_KEY: ${{ secrets.LUMIFY_API_KEY }}
          PANTHERA_SPLITS_FIXTURE: tests/fixtures/lumify_splits.json
        run: |
          if [ "$IN_DRY_RUN" = "true" ]; then
            panthera-mvp splits --label "$IN_LABEL" --dry-run
          else
            panthera-mvp splits --label "$IN_LABEL"
          fi

      - name: Regenerate reports
        run: panthera-mvp report

      - name: Commit & push
        if: inputs.dry_run != true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LUMIFY_API_KEY: ${{ secrets.LUMIFY_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          bash scripts/ci/data_branch.sh push "data: splits run $(date -u +%FT%TZ) [skip ci]"


      # A failed push would otherwise discard the run's data with the runner.
      - name: Keep the unpushed data commit
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-delta
          path: ${{ runner.temp }}/data-delta.patch
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
