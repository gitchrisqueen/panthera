name: MVP Splits Collection

# Manual-only: collect public betting splits (Lumify) for today's slate on
# demand — used to verify the LUMIFY_API_KEY and for catch-up runs. The
# scheduled pregame workflow also collects splits daily at 16:50 ET.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use fixture splits instead of live Lumify calls"
        type: boolean
        default: false
      label:
        description: "Snapshot label to store the fetch under"
        type: choice
        options: [manual, morning, pregame]
        default: manual

permissions:
  contents: write

concurrency:
  group: panthera-data
  cancel-in-progress: false

jobs:
  splits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Overlay bot data from the data branch
        run: bash scripts/ci/data_branch.sh pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Collect betting splits
        env:
          LUMIFY_API_KEY: ${{ secrets.LUMIFY_API_KEY }}
          PANTHERA_SPLITS_FIXTURE: tests/fixtures/lumify_splits.json
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            panthera-mvp splits --label "${{ inputs.label }}" --dry-run
          else
            panthera-mvp splits --label "${{ inputs.label }}"
          fi

      - name: Regenerate reports
        run: panthera-mvp report

      - name: Commit & push
        run: |
          bash scripts/ci/data_branch.sh push "data: splits run $(date -u +%FT%TZ) [skip ci]"
