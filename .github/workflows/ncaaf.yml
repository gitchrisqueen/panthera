name: NCAAF Strategy

# Live paper-trading for config/ncaaf_strategies/ (cfb_spread_total_parlay and
# cfb_spread_total_parlay_v2: one shared snapshot, each strategy decides once a day).
# One workflow, four crons, told apart by github.event.schedule:
#
#   5 13-23,0-4 * 8-12,1 *   hourly 9:05-00:05 ET, plus
#   35 15-23,0-4 * 8-12,1 *  11:35-00:35 ET (EDT): `ncaaf picks --auto`. A no-op
#                      (no network, no credits, no commit) unless the day's
#                      first kickoff is 15-90 min away; then
#                      it takes one decision-<date> snapshot (3 cr) and
#                      decides the day (once). Half-hourly + no lower bound
#                      because GitHub starts crons 15-50 min late — hourly
#                      runs could straddle a 60-min window and skip a day.
#                      No :35 at 13-14 UTC: 14:35 is MLB morning, and a newer
#                      queued run in the panthera-data group cancels an older
#                      pending one (no kickoff is early enough to need it).
#   10 23 * 8-12,1 0,3  Sun + Wed 19:10 ET: `ncaaf prep` — ESPN games 8 days
#                      back / 14 ahead (after Sunday's AP poll), an "open"
#                      snapshot (3 cr; skipped when nothing is upcoming),
#                      CFBD SP+ + venues when CFBD_API_KEY is set
#   15 13 * 8-12,1 *   daily 9:15 ET: `ncaaf grade` (tickets + qualifying
#                      legs) and the report
#
# Every cron carries the month filter 8-12,1 (Aug-Dec + Jan): the season runs
# late Aug to the CFP final about Jan 20, and the offseason runs were all
# no-ops. Cron months are UTC, so an ET evening game on Jan 31 would fall in
# Feb 1 UTC hours 0-4 and be skipped; no game is that late. The hours and
# weekdays are NOT narrowed: the committed kickoff data (Oct 1 - Nov 4, no
# bowl or CFP weeks) does not support it, see the PR that added the filter.
# The `Which task` case patterns below must equal these cron strings exactly;
# a scheduled run that matches none exits 1 instead of silently doing nothing.
#
# Credits: ~2 open + ~4 game-day decision snapshots/week ≈ 78/month on top of
# MLB's ≈ 270 (500 free; NCAAF reserve 60 so MLB keeps priority).
on:
  schedule:
    - cron: "5 13-23,0-4 * 8-12,1 *"
    - cron: "35 15-23,0-4 * 8-12,1 *"
    - cron: "10 23 * 8-12,1 0,3"
    - cron: "15 13 * 8-12,1 *"
  workflow_dispatch:
    inputs:
      task:
        description: "picks = decide cfb_spread_total_parlay and cfb_spread_total_parlay_v2 now (ignores the window); prep; grade"
        type: choice
        options: [picks, prep, grade]
        default: prep
      dry_run:
        description: "Fixture odds, 0 credits, nothing committed"
        type: boolean
        default: true
      gate_fixture:
        description: "Test the pre-check gate: a JSON file under tests/fixtures/ncaaf/ (forces dry_run)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: panthera-data
  cancel-in-progress: false

jobs:
  # Fail-open pre-check (issue #79): a scheduled half-hourly `picks --auto` run that
  # provably has nothing to do exits here, before `pip install`. Anything the gate
  # cannot prove, including a failed checkout, fetch or script, counts as "go".
  # scripts/ci/ncaaf_gate.py has the rules; keep its AUTO_CRONS in step with the
  # `Which task` case below.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the data files the gate reads
        run: |
          git fetch --quiet --depth=1 origin data
          git show FETCH_HEAD:data/ncaaf/games/games.csv > "$RUNNER_TEMP/games.csv"
          git show FETCH_HEAD:data/ncaaf/tickets/decisions.csv > "$RUNNER_TEMP/decisions.csv"

      - name: Gate
        id: gate
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_SCHEDULE: ${{ github.event.schedule }}
          GATE_FIXTURE: ${{ inputs.gate_fixture }}
        run: >-
          python3 scripts/ci/ncaaf_gate.py
          --games-csv "$RUNNER_TEMP/games.csv" --decisions-csv "$RUNNER_TEMP/decisions.csv"

  run:
    needs: gate
    # Runs when the gate said go, or when the gate itself failed and no fixture was asked
    # for (fail open). With a fixture the gate's verdict is the test: a rejected or broken
    # fixture never runs the job.
    if: >-
      ${{ !cancelled()
      && (inputs.gate_fixture == ''
          || (startsWith(inputs.gate_fixture, 'tests/fixtures/ncaaf/')
              && !contains(inputs.gate_fixture, '..')))
      && ((inputs.gate_fixture == '' && needs.gate.result != 'success')
          || needs.gate.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # dispatch pages.yml after a real push (see the last step)
    timeout-minutes: 10
    env:
      TASK_INPUT: ${{ inputs.task }}
      DRY_RUN_INPUT: ${{ inputs.dry_run }}
      GATE_FIXTURE: ${{ inputs.gate_fixture }}
    steps:
      - uses: actions/checkout@v4

      # A gate fixture always means a dry run: nothing is committed or spent.
      - name: Effective dry run
        run: |
          case "$TASK_INPUT" in picks|prep|grade|"") ;; *) echo "::error::unknown task"; exit 1 ;; esac
          if [ "$DRY_RUN_INPUT" = "true" ] || [ -n "$GATE_FIXTURE" ]; then
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
          else
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
          fi

      - name: Overlay bot data from the data branch
        run: bash scripts/ci/data_branch.sh pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Which task
        id: task
        run: |
          case "${{ github.event.schedule }}" in
            "5 13-23,0-4 * 8-12,1 *")  echo "task=auto" >> "$GITHUB_OUTPUT" ;;
            "35 15-23,0-4 * 8-12,1 *") echo "task=auto" >> "$GITHUB_OUTPUT" ;;
            "10 23 * 8-12,1 0,3")      echo "task=prep" >> "$GITHUB_OUTPUT" ;;
            "15 13 * 8-12,1 *")        echo "task=grade" >> "$GITHUB_OUTPUT" ;;
            *)                         echo "task=${TASK_INPUT}" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ "${{ github.event_name }}" = "schedule" ] \
             && [ -z "$(sed -n 's/^task=//p' "$GITHUB_OUTPUT" | tail -n 1)" ]; then
            echo "::error::scheduled run matched no known cron string: ${{ github.event.schedule }}"
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry=--dry-run" >> "$GITHUB_OUTPUT"; echo "odds=dry_run" >> "$GITHUB_OUTPUT"
          else
            echo "dry=" >> "$GITHUB_OUTPUT"; echo "odds=live" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide (hourly, window-gated)
        if: steps.task.outputs.task == 'auto'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: panthera-mvp ncaaf picks --auto

      - name: Decide now (manual)
        if: steps.task.outputs.task == 'picks'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PANTHERA_NCAAF_ODDS_FIXTURE: tests/fixtures/ncaaf/odds_ncaaf_snapshot.json
        run: panthera-mvp ncaaf picks ${{ steps.task.outputs.dry }}

      - name: Prep the week
        if: steps.task.outputs.task == 'prep'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          PANTHERA_NCAAF_ODDS_FIXTURE: tests/fixtures/ncaaf/odds_ncaaf_snapshot.json
        run: panthera-mvp ncaaf prep --odds ${{ steps.task.outputs.odds }}

      - name: Grade
        if: steps.task.outputs.task == 'grade'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: panthera-mvp ncaaf grade

      # The report carries a timestamp, so it is regenerated only when the
      # NCAAF data changed — the hourly no-op must not commit.
      - name: Report
        run: |
          if bash scripts/ci/data_branch.sh changed data/ncaaf; then
            panthera-mvp ncaaf report
          fi

      - name: Commit & push
        id: commit
        if: env.DRY_RUN != 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LUMIFY_API_KEY: ${{ secrets.LUMIFY_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          bash scripts/ci/data_branch.sh push "data: ncaaf ${{ steps.task.outputs.task }} $(date -u +%FT%TZ) [skip ci]"

      # A failed push would otherwise discard the run's data with the runner.
      - name: Keep the unpushed data commit
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-delta
          path: ${{ runner.temp }}/data-delta.patch
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      # Football results reach the site within minutes instead of waiting for
      # the next MLB morning/pregame run (pages.yml's workflow_run triggers).
      # Only after a real push, so the hourly no-op runs never deploy. Not after
      # a SCHEDULED `grade`: the next successful MVP Morning run deploys about
      # 80 minutes later (pages.yml runs only on success) and carries the graded
      # data. A manual dispatch of `grade` still deploys, so it is never left
      # waiting on that run.
      # GITHUB_TOKEN-dispatched runs do start (only pushes are suppressed).
      - name: Deploy dashboard
        if: steps.commit.outputs.pushed == 'true' && !(steps.task.outputs.task == 'grade' && github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
