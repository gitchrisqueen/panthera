name: MVP Historical Calibration

# One-off (manual) workflow: downloads free historical MLB odds archives,
# commits them, then runs the backtest calibration sweep to derive the P/V
# day map + thresholds and writes config/strategy.calibrated.yaml and
# reports/CALIBRATION.md. Runs on a GitHub runner because the archives and
# calibration need unrestricted network + ~30 min of CPU.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Season range to download"
        default: "2014-2023"
      train:
        description: "Training seasons"
        default: "2014-2019"
      validate:
        description: "Validation seasons (2020 skipped: 60-game season)"
        default: "2021-2023"

permissions:
  contents: read

concurrency:
  group: panthera-data
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      IN_SEASONS: ${{ inputs.seasons }}
      IN_TRAIN: ${{ inputs.train }}
      IN_VALIDATE: ${{ inputs.validate }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate dispatch inputs
        run: bash scripts/ci/validate_inputs.sh IN_SEASONS:range IN_TRAIN:range IN_VALIDATE:range

      - name: Overlay bot data from the data branch
        run: bash scripts/ci/data_branch.sh pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Download historical odds archives
        run: |
          mkdir -p data/historical/raw
          IFS=- read LO HI <<< "$IN_SEASONS"
          for Y in $(seq $LO $HI); do
            [ "$Y" = "2020" ] && continue  # 60-game COVID season skews rates
            OUT="data/historical/raw/mlb odds $Y.xlsx"
            [ -s "$OUT" ] && { echo "$Y already present"; continue; }
            for URL in \
              "https://www.sportsbookreviewsonline.com/scoresoddsarchives/mlb/mlb%20odds%20$Y.xlsx" \
              "https://www.sportsbookreviewsonline.com/wp-content/uploads/sportsbookreviewsonline_com_737/mlb-odds-$Y.xlsx"; do
              echo "trying $URL"
              if curl -fsSL --retry 3 -o "$OUT" "$URL" && [ -s "$OUT" ]; then
                echo "downloaded $Y"; break
              fi
              rm -f "$OUT"
            done
            [ -s "$OUT" ] || echo "WARNING: season $Y unavailable from known sources"
          done
          ls -la data/historical/raw/

      - name: Run calibration sweep
        run: |
          panthera-mvp calibrate \
            --train "$IN_TRAIN" \
            --validate "$IN_VALIDATE" \
            --write-config

      # config/ is code on protected main: ship the calibrated config as an
      # artifact for a human PR instead of committing it.
      - name: Capture calibrated config
        run: |
          mkdir -p capture
          git diff -- config > capture/calibrated-config.patch

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: calibrated-config
          path: capture/
          retention-days: 14

      - name: Commit & push
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LUMIFY_API_KEY: ${{ secrets.LUMIFY_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          bash scripts/ci/data_branch.sh push "data: historical calibration sweep [skip ci]"


      # A failed push would otherwise discard the run's data with the runner.
      - name: Keep the unpushed data commit
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-delta
          path: ${{ runner.temp }}/data-delta.patch
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
