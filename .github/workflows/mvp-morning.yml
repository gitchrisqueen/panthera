name: MVP Morning Run

# 10:35 ET (EDT = UTC-4). Grades yesterday's picks, takes the opening odds
# snapshot (3 credits), generates picks for afternoon starts, refreshes
# reports. See .github/workflows/CLAUDE.md for the cron<->ET table and the
# bot-commit loop guards.
on:
  schedule:
    - cron: "35 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use fixture odds instead of a live (3-credit) API call"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: panthera-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Grade yesterday's picks
        run: panthera-mvp grade

      - name: Opening odds snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PANTHERA_ODDS_FIXTURE: tests/fixtures/odds_snapshot.json
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            panthera-mvp snapshot --label open --dry-run
          else
            panthera-mvp snapshot --label open
          fi

      - name: Picks for afternoon games
        run: panthera-mvp picks --window-end-et 16:00

      - name: Regenerate reports
        run: panthera-mvp report

      - name: Commit & push
        run: |
          git config user.name "panthera-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: morning run $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
