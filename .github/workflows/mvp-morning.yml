name: MVP Morning Run

# 10:35 ET (EDT = UTC-4). Grades yesterday's picks, takes the opening odds
# snapshot (3 credits), generates picks for afternoon starts, refreshes
# reports. See .github/workflows/CLAUDE.md for the cron<->ET table and the
# bot-commit loop guards.
on:
  schedule:
    - cron: "35 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use fixture odds instead of a live (3-credit) API call"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: panthera-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Overlay bot data from the data branch
        run: bash scripts/ci/data_branch.sh pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Grade yesterday's picks
        run: panthera-mvp grade

      - name: Opening odds snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PANTHERA_ODDS_FIXTURE: tests/fixtures/odds_snapshot.json
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            panthera-mvp snapshot --label open --dry-run
          else
            panthera-mvp snapshot --label open
          fi

      - name: Public betting splits (Lumify, morning)
        env:
          LUMIFY_API_KEY: ${{ secrets.LUMIFY_API_KEY }}
          PANTHERA_SPLITS_FIXTURE: tests/fixtures/lumify_splits.json
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            panthera-mvp splits --label morning --dry-run
          else
            panthera-mvp splits --label morning
          fi

      - name: Picks for afternoon games
        run: panthera-mvp picks --window-end-et 16:00 --label morning

      - name: Regenerate reports
        run: panthera-mvp report

      - name: Commit & push
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LUMIFY_API_KEY: ${{ secrets.LUMIFY_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          bash scripts/ci/data_branch.sh push "data: morning run $(date -u +%FT%TZ) [skip ci]"


      # A failed push would otherwise discard the run's data with the runner.
      - name: Keep the unpushed data commit
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-delta
          path: ${{ runner.temp }}/data-delta.patch
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
