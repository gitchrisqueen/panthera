name: MVP Close Snapshot

# 18:20 ET (22:20 UTC in EDT) — the closing-line-value snapshot. Lands after
# the pregame picks run priced its bets (~17:00 ET) and before ~96% of first
# pitches, giving nearly every pick a genuinely post-pick pre-start price.
# This label is CLV-only: pick generation never uses `close` as a movement
# endpoint (see strategy/movement.py). Costs 3 credits; total budget stays
# ~360/month against the 500 free-tier cap.
#
# DST caveat: cron is UTC. 22:20 UTC = 18:20 ET only during EDT; in EST it
# drifts to 17:20 ET, which is still after the pregame run and before the
# evening slate, so no adjustment is required in November.
on:
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use fixture odds instead of a live (3-credit) API call"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: panthera-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Overlay bot data from the data branch
        run: bash scripts/ci/data_branch.sh pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Close odds snapshot (CLV endpoint)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PANTHERA_ODDS_FIXTURE: tests/fixtures/odds_snapshot.json
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            panthera-mvp snapshot --label close --dry-run
          else
            panthera-mvp snapshot --label close
          fi

      - name: Commit & push
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LUMIFY_API_KEY: ${{ secrets.LUMIFY_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          bash scripts/ci/data_branch.sh push "data: close snapshot $(date -u +%FT%TZ) [skip ci]"


      # A failed push would otherwise discard the run's data with the runner.
      - name: Keep the unpushed data commit
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-delta
          path: ${{ runner.temp }}/data-delta.patch
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
