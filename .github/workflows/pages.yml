name: Deploy Pages

# Builds and deploys the public GitHub Pages dashboard (panthera-mvp pages)
# after either data-changing run completes. Triggered via workflow_run, not
# push, because pushes made with the default GITHUB_TOKEN don't trigger new
# workflow runs (see .github/workflows/CLAUDE.md's bot-commit loop guards) —
# workflow_run fires on completion of the named run regardless. Deliberately
# NOT wired into mvp-close.yml: close only takes a CLV snapshot and never
# calls `panthera-mvp report`, so there is no new ledger data to publish
# after it runs.
#
# Also dispatched (workflow_dispatch, run label "manual") by ncaaf.yml after
# any NCAAF run that pushed data, so football.html updates within minutes.
#
# One-time manual step this workflow depends on (not done by this file):
# the repo's Pages source must be switched to "GitHub Actions" in
# Settings -> Pages (or `gh api -X PUT repos/<owner>/<repo>/pages -f
# build_type=workflow`) before the deploy job below can publish anything.
#
# DATA SOURCE (2026-11-09): data/ and reports/ come from the `data` branch, overlaid by
# `scripts/ci/data_branch.sh pull` right after checkout, at the branch tip when this job
# runs. That makes the head_sha problem below moot for data; the checkout still only
# supplies code.
#
# CHECKOUT GOTCHA (fixed 2026-08-20, was live ~20h): do NOT pin the checkout
# to `github.event.workflow_run.head_sha`. For a schedule-triggered run,
# that field is the commit the run STARTED from, not what it pushed — the
# triggering workflows (mvp-morning/mvp-pregame) commit their new picks as
# their OWN last step, so head_sha is always the commit BEFORE that data.
# Confirmed live: mvp-morning's own headSha was 3f3e205 even though it went
# on to push eeb717f; the resulting dashboard build's checkout logged
# "HEAD is now at 3f3e205" and site_data.json silently had zero rows for
# the day it had just generated. The plain default checkout below resolves
# to the default branch's CURRENT tip — which, by the time this workflow's
# job actually runs (after the triggering workflow has fully finished,
# including its push), already includes that commit.
on:
  workflow_run:
    workflows: ["MVP Morning Run", "MVP Pregame Run", "Panthera Catch-up"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One pages run at a time, never cancelled: the group wraps the whole run (build
# and deploy), a run in flight finishes, and when several are queued only the
# newest pending one is kept (a build always reads the current tip, so nothing
# is lost; the dropped run's --run-label is not shown on the site).
concurrency:
  group: pages-build
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.change.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Overlay bot data from the data branch
        run: bash scripts/ci/data_branch.sh pull

      # Change detection (issue #80). The dashboard is a pure function of the code and
      # config on the checked-out ref and the data on the `data` branch. The key below
      # is hashed from those git tree ids, and the last deploy publishes it as
      # build-key.txt. Equal key = nothing to rebuild. A manual dispatch always builds,
      # and any problem reading the live key (404, timeout, first run) builds too.
      # This job runs no security gate, so there is nothing here a filter could hide.
      - name: Detect changes since the last deploy
        id: change
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code="$(git rev-parse HEAD:src HEAD:config HEAD:pyproject.toml)"
          data="$(git -C .databranch rev-parse HEAD:data HEAD:reports)"
          key="$(printf '%s\n%s\n' "$code" "$data" | sha256sum | cut -d' ' -f1)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          live="$(curl -fsS --max-time 15 "https://gitchrisqueen.github.io/panthera/build-key.txt" 2>/dev/null || true)"
          if [ "$EVENT" != "workflow_dispatch" ] && [ -n "$live" ] && [ "$live" = "$key" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed since the last deploy (key $key); skipping the build."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.change.outputs.build == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        if: steps.change.outputs.build == 'true'
        run: pip install -e .

      - name: Build dashboard
        if: steps.change.outputs.build == 'true'
        run: >-
          panthera-mvp pages
          --run-label ${{ github.event.workflow_run.name == 'MVP Pregame Run' && 'pregame' || github.event.workflow_run.name == 'MVP Morning Run' && 'morning' || 'manual' }}

      - name: Stamp the build key
        if: steps.change.outputs.build == 'true'
        run: echo "${{ steps.change.outputs.key }}" > site/build-key.txt

      - uses: actions/upload-pages-artifact@v3
        if: steps.change.outputs.build == 'true'
        with:
          path: site/

  deploy:
    needs: build
    if: needs.build.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
