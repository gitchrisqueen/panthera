name: Deploy Pages

# Builds and deploys the public GitHub Pages dashboard (panthera-mvp pages)
# after either data-changing run completes. Triggered via workflow_run, not
# push, because pushes made with the default GITHUB_TOKEN don't trigger new
# workflow runs (see .github/workflows/CLAUDE.md's bot-commit loop guards) —
# workflow_run fires on completion of the named run regardless. Deliberately
# NOT wired into mvp-close.yml: close only takes a CLV snapshot and never
# calls `panthera-mvp report`, so there is no new ledger data to publish
# after it runs.
#
# One-time manual step this workflow depends on (not done by this file):
# the repo's Pages source must be switched to "GitHub Actions" in
# Settings -> Pages (or `gh api -X PUT repos/<owner>/<repo>/pages -f
# build_type=workflow`) before the deploy job below can publish anything.
#
# CHECKOUT GOTCHA (fixed 2026-08-20, was live ~20h): do NOT pin the checkout
# to `github.event.workflow_run.head_sha`. For a schedule-triggered run,
# that field is the commit the run STARTED from, not what it pushed — the
# triggering workflows (mvp-morning/mvp-pregame) commit their new picks as
# their OWN last step, so head_sha is always the commit BEFORE that data.
# Confirmed live: mvp-morning's own headSha was 3f3e205 even though it went
# on to push eeb717f; the resulting dashboard build's checkout logged
# "HEAD is now at 3f3e205" and site_data.json silently had zero rows for
# the day it had just generated. The plain default checkout below resolves
# to the default branch's CURRENT tip — which, by the time this workflow's
# job actually runs (after the triggering workflow has fully finished,
# including its push), already includes that commit.
on:
  workflow_run:
    workflows: ["MVP Morning Run", "MVP Pregame Run"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# No explicit concurrency.group here — actions/deploy-pages sets its own
# "github-pages" group automatically; declaring one here would conflict.

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Build dashboard
        run: >-
          panthera-mvp pages
          --run-label ${{ github.event.workflow_run.name == 'MVP Pregame Run' && 'pregame' || github.event.workflow_run.name == 'MVP Morning Run' && 'morning' || 'manual' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
