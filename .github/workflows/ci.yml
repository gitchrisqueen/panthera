name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "data/**"
      - "reports/**"
      - "badges/**"
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - "data/**"
      - "reports/**"
      - "badges/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: pytest tests/ -q
