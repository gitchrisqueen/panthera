name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "data/**"
      - "reports/**"
      - "badges/**"
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - "data/**"
      - "reports/**"
      - "badges/**"
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Run tests
        run: pytest tests/ -q
