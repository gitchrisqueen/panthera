name: MVP Pregame Run

# 16:50 ET, ~2h before the main evening slate. Takes the pregame snapshot
# (3 credits) and generates picks for the evening games with movement
# measured open -> pregame.
on:
  schedule:
    - cron: "50 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use fixture odds instead of a live (3-credit) API call"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: panthera-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Overlay bot data from the data branch
        run: bash scripts/ci/data_branch.sh pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Pregame odds snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PANTHERA_ODDS_FIXTURE: tests/fixtures/odds_snapshot.json
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            panthera-mvp snapshot --label pregame --dry-run
          else
            panthera-mvp snapshot --label pregame
          fi

      - name: Public betting splits (Lumify)
        env:
          LUMIFY_API_KEY: ${{ secrets.LUMIFY_API_KEY }}
          PANTHERA_SPLITS_FIXTURE: tests/fixtures/lumify_splits.json
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            panthera-mvp splits --label pregame --dry-run
          else
            panthera-mvp splits --label pregame
          fi

      - name: Picks for evening games
        run: panthera-mvp picks --window-end-et 23:59 --label pregame

      - name: Regenerate reports
        run: panthera-mvp report

      - name: Commit & push
        if: inputs.dry_run != true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LUMIFY_API_KEY: ${{ secrets.LUMIFY_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          bash scripts/ci/data_branch.sh push "data: pregame run $(date -u +%FT%TZ) [skip ci]"


      # A failed push would otherwise discard the run's data with the runner.
      - name: Keep the unpushed data commit
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-delta
          path: ${{ runner.temp }}/data-delta.patch
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
