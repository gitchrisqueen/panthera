[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panthera-mvp"
version = "0.1.0"
description = "Project Panthera MVP — automated MLB betting strategy validation pipeline"
authors = [{ name = "Christopher Queen", email = "christopher.queen@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
panthera-mvp = "panthera_mvp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/panthera_mvp"]

[tool.pytest.ini_options]
# Fence: only collect the new top-level tests/ dir. backend/tests/ contains
# broken legacy stubs that must never be collected.
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["backend", "frontend", "db", "mockup", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
