[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panthera-mvp"
version = "0.1.0"
description = "Project Panthera MVP — automated MLB betting strategy validation pipeline"
authors = [{ name = "Christopher Queen", email = "christopher.queen@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "lumify-sdk>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# Browser-geometry audit for the Pages dashboard (scripts/site_audit.py).
# Deliberately NOT in `dev`: `pip install -e ".[dev]"` — what CI's test job and
# every local checkout run — must stay Playwright-free (~200MB of browser).
audit = [
    "playwright>=1.47",
]

[project.scripts]
panthera-mvp = "panthera_mvp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/panthera_mvp"]

[tool.pytest.ini_options]
# Fence: only collect the new top-level tests/ dir. backend/tests/ contains
# broken legacy stubs that must never be collected.
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# `scripts` is NOT excluded, so these files get the same lint as the rest.
# NOTE: linting them would NOT have caught the breakage that prompted this —
# proof_refactor_identity.py imported a symbol that no longer existed, and
# ruff does no cross-module resolution (the name was used, so not even
# F401). tests/test_scripts_import.py is what catches that class.
# The frozen legacy trees stay excluded.
extend-exclude = ["backend", "frontend", "db", "mockup"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
