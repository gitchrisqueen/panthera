[tool.poetry]
name = "panthera"
version = "0.1.0"
description = "An application for managing users, games, betting lines, and alerts."
authors = ["Christopher Queen <christopher.queen@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8"
Flask = "2.1.1"
Flask-SQLAlchemy = "2.5.1"
APScheduler = "3.7.0"
requests = "2.26.0"
PyJWT = "2.3.0"

[tool.poetry.dev-dependencies]
pytest = "^6.2"
pytest-flask = "^1.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"