[tool.poetry]
name = "panthera"
version = "0.1.0"
description = "An application for managing users, games, betting lines, and alerts."
authors = ["Christopher Queen <christopher.queen@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8"
Flask = "3.0.3"
Flask-SQLAlchemy = "3.1.1"
APScheduler = "3.10.4"
requests = "2.32.3"
PyJWT = "2.9.0"
Werkzeug="3.0.3"
Flask-Migrate="4.0.7"
Flask-Script="2.0.6"
python-dotenv="1.0.1"
pymysql="1.1.1"

[tool.poetry.dev-dependencies]
pytest = "^6.2"
pytest-flask = "^1.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"